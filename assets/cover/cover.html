<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pixel Art Tutor — cover</title>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: block;
        src: url("fonts/pixelify-400.woff2") format("woff2");
      }

      @font-face {
        font-family: "VT323";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("fonts/vt323.woff2") format("woff2");
      }

      :root {
        --paper: #0d1112;
        --paper-warm: #121718;
        --ink: #f4f4f4;
        --ink-soft: #b8b8b8;
        --ink-faint: #6f6f6f;
        --line: #303839;
        --mint: #39c5bb;
        --mint-dark: #167c76;
        --red: #ff2e2e;
        --shadow: rgba(0, 0, 0, 0.52);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(80% 90% at 78% 48%, rgba(57, 197, 187, 0.16), transparent 58%),
          radial-gradient(50% 70% at 18% 80%, rgba(255, 46, 46, 0.1), transparent 62%),
          linear-gradient(180deg, #101516 0%, var(--paper) 100%);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 16px 16px;
        mask-image: radial-gradient(120% 90% at 70% 50%, black 20%, transparent 78%);
        pointer-events: none;
      }

      .hero-art {
        position: absolute;
        top: 0;
        right: 0;
        width: 62%;
        height: 100%;
        object-fit: cover;
        object-position: 100% 48%;
        image-rendering: pixelated;
        mask-image: linear-gradient(90deg, transparent 0%, #000 16%, #000 100%);
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 16%, #000 100%);
        filter: saturate(1.08) contrast(1.04);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, var(--paper) 0%, rgba(13, 17, 18, 0.94) 30%, rgba(13, 17, 18, 0.22) 56%, transparent 70%),
          linear-gradient(180deg, rgba(13, 17, 18, 0.28), transparent 16%, transparent 84%, rgba(13, 17, 18, 0.5));
        pointer-events: none;
      }

      .copy {
        position: absolute;
        z-index: 2;
        left: 5.6%;
        top: 50%;
        transform: translateY(-52%);
        width: min(54%, 780px);
        display: flex;
        flex-direction: column;
        gap: 1.4vw;
      }

      h1 {
        font-size: 5.7vw;
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: 0.01em;
      }

      h1 em {
        display: block;
        color: var(--mint);
        font-style: normal;
      }

      .tagline {
        color: var(--ink-soft);
        font-family: "VT323", ui-monospace, monospace;
        font-size: 2.2vw;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      .pet-wrap {
        position: absolute;
        z-index: 3;
        right: 4.2%;
        bottom: 7.2%;
        width: 15.6vw;
      }

      .pet {
        display: block;
        width: 100%;
        image-rendering: pixelated;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      }

      .bubble {
        position: absolute;
        right: calc(100% + 0.35vw);
        bottom: 64%;
        white-space: nowrap;
        background: #050505;
        color: var(--mint);
        border: 2px solid #555;
        outline: 1px solid #161616;
        font-family: "VT323", ui-monospace, monospace;
        font-size: 1.7vw;
        font-weight: 400;
        letter-spacing: 0.04em;
        padding: 0.28vw 0.7vw 0.4vw;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
      }

      .bubble::after {
        content: "";
        position: absolute;
        right: -0.48vw;
        bottom: 0.55vw;
        width: 0.62vw;
        height: 0.62vw;
        background: #050505;
        border-right: 2px solid #555;
        border-bottom: 2px solid #555;
        transform: rotate(-45deg);
      }

      .credit {
        position: absolute;
        z-index: 2;
        left: 5.6%;
        bottom: 4.4%;
        color: var(--ink-faint);
        font-family: "VT323", ui-monospace, monospace;
        font-size: 1.25vw;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="hero-art" src="studio-canvas.jpg" alt="" />
      <div class="vignette"></div>
      <div class="copy">
        <h1>Pixel Art <em>Tutor</em></h1>
        <p class="tagline">Humans and agents. One canvas.</p>
      </div>
      <div class="pet-wrap">
        <div class="bubble">set_pixels</div>
        <img class="pet" src="codex-laptop.png" alt="" />
      </div>
      <p class="credit">Made by Ultima</p>
    </div>
  </body>
</html>
